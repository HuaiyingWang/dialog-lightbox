<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>範例三：影片＋字幕</title>
<!-- Bootstrap 5.3.8 與 DialogLightbox v1.3.0：皆鎖定版本＋SRI 完整性驗證 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/HuaiyingWang/dialog-lightbox@72b2b13ceb6ed191438bbcbe3642b53465b653b3/dist/dialog-lightbox.min.css"
      integrity="sha384-Ox3COodi7394+8HLW0PSY2Mb4lvUQDel1KVa0yPu+ZPQiwMLEGLMbow9qiInVfAZ" crossorigin="anonymous">
</head>
<body>
<main class="container py-5">
  <section aria-labelledby="video-title">
    <h2 id="video-title" class="h4 mb-3">活動影音</h2>
    <!--
      影片：MDN 公開的 CC0 範例影片
      字幕：以 data: 網址內嵌 WebVTT，正式使用請改成自家 .vtt 檔的完整網址
            （跨網域字幕檔需伺服器開啟 CORS）
    -->
    <a class="btn btn-dark" href="https://developer.mozilla.org/shared-assets/videos/flower.mp4"
       data-lbx data-lbx-type="video"
       data-lbx-track="data:text/vtt;charset=utf-8,WEBVTT%0A%0A00:00.000%20-->%2000:02.000%0A（示範字幕）第一段%0A%0A00:02.000%20-->%2000:04.000%0A（示範字幕）字幕可由播放器開關%0A%0A00:04.000%20-->%2000:06.000%0A（示範字幕）關閉燈箱時影片自動停止"
       data-lbx-track-lang="zh-Hant"
       data-lbx-track-label="中文字幕"
       data-lbx-title="示範影片：花朵"
       data-lbx-caption="示範影片（含中文字幕）"
       aria-haspopup="dialog">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="me-1 align-text-top"><path d="M8 5v14l11-7z"/></svg>播放影片
    </a>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/gh/HuaiyingWang/dialog-lightbox@72b2b13ceb6ed191438bbcbe3642b53465b653b3/dist/dialog-lightbox.min.js"
        integrity="sha384-rFuCkHYyurmf9J3he3OuS8wLEkBHOk0VHQjkX5hC63oqueWDtCHHcCOpSGOU80Wy" crossorigin="anonymous"></script>
<script>
  // 允許 https 網址；data: 僅用於內嵌字幕（元件會依類型限制 data:text/ 等 MIME）
  const lightbox = new DialogLightbox({ mediaProtocols: ['https:', 'data:'] });
</script>
</body>
</html>
