<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>範例六：首頁公告彈窗</title>
<!-- Bootstrap 5.3.8 與 DialogLightbox v1.3.0：皆鎖定版本＋SRI 完整性驗證 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/HuaiyingWang/dialog-lightbox@72b2b13ceb6ed191438bbcbe3642b53465b653b3/dist/dialog-lightbox.min.css"
      integrity="sha384-Ox3COodi7394+8HLW0PSY2Mb4lvUQDel1KVa0yPu+ZPQiwMLEGLMbow9qiInVfAZ" crossorigin="anonymous">
</head>
<body>
<main class="container py-5">
  <h1 class="h3">首頁</h1>

  <!-- 公告內容：放一個 [data-lbx-snooze] 核取方塊即可支援「今天不再顯示」 -->
  <template id="tpl-notice">
    <p class="mb-2"><strong>系統維護公告</strong></p>
    <p>本網站將於 <time datetime="2026-11-15T22:00">11 月 15 日（六）22:00</time> 至
       <time datetime="2026-11-16T02:00">隔日 02:00</time> 進行系統維護，期間暫停線上報名服務，造成不便敬請見諒。</p>
    <p><a href="https://www.example.com/news/maintenance">查看維護詳情</a></p>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 pt-2 border-top">
      <div class="form-check mb-0 pt-2">
        <input class="form-check-input" type="checkbox" id="notice-snooze" data-lbx-snooze>
        <label class="form-check-label" for="notice-snooze">今天不再顯示</label>
      </div>
      <button type="button" class="btn btn-primary mt-2" data-lbx-close value="ok" autofocus>我知道了</button>
    </div>
  </template>
</main>

<script src="https://cdn.jsdelivr.net/gh/HuaiyingWang/dialog-lightbox@72b2b13ceb6ed191438bbcbe3642b53465b653b3/dist/dialog-lightbox.min.js"
        integrity="sha384-rFuCkHYyurmf9J3he3OuS8wLEkBHOk0VHQjkX5hC63oqueWDtCHHcCOpSGOU80Wy" crossorigin="anonymous"></script>
<script>
  const notice = new DialogLightbox({ variant: 'modal', selector: '[data-notice]' });

  // 每則公告使用不同 ID，換新公告時改 ID 即會重新顯示
  const NOTICE_ID = 'maintenance-2026-11';

  window.addEventListener('load', () => {
    notice.autoOpen('#tpl-notice', { title: '網站公告', snooze: NOTICE_ID });
  });

  // 其他 API：
  // DialogLightbox.isSnoozed(NOTICE_ID)   → 今天是否已設定不再顯示
  // DialogLightbox.clearSnooze(NOTICE_ID) → 清除紀錄
</script>
</body>
</html>
